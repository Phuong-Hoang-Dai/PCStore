server {
    listen 80;
    root /usr/share/nginx/html;

    # Client-side routes (/orders, /payment/success, ...) fall back to the SPA entry.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
